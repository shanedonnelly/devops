events {
    worker_connections 1024;
}

http {
    upstream builder {
        server builder-service:8000;
    }

    upstream catalogue {
        server catalogue-service:8000;
    }

    upstream chatbot {
        server chatbot-api:8000;
    }

    server {
        listen 80;

        # Include MIME types
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Public Sites - Direct access without authentication
        # This route must come BEFORE the /devops/shanify location
        location ~ ^/devops/shanify/([a-z0-9-]+)$ {
            alias /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Frontend React - Admin Panel
        location /devops/shanify {
            alias /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /devops/api/builder-service/ {
            proxy_pass http://builder;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /devops/api/catalogue-service/ {
            proxy_pass http://catalogue;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /devops/api/chatbot/ {
            proxy_pass http://chatbot/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /devops/api/pgadmin {
            return 301 /devops/api/pgadmin/;
        }

        location /devops/api/pgadmin/ {
            proxy_pass http://pgadmin:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Script-Name /devops/api/pgadmin;
            proxy_redirect ~^/(.*)$ /devops/api/pgadmin/$1;
        }

        location /devops/api/minio/ {
            proxy_pass http://minio:9001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Disable buffering for real-time streaming
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /devops/api/minio-api/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable request and response buffering
            proxy_buffering off;
            proxy_request_buffering off;

            # Allow large file uploads
            client_max_body_size 0;
        }
    }
}