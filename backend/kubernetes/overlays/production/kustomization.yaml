apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sitebuilder-production

resources:
  - ../../base
  - ingress.yaml
  - middlewares.yaml

patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: app-config

images:
  - name: shanedonnelly34/builder-service
    newTag: "1.0"
  - name: shanedonnelly34/catalogue-service
    newTag: "1.0"
  - name: shanedonnelly34/chatbot-microservice
    newTag: "1.1"
  - name: shanedonnelly34/nginx
    newTag: "1.1"