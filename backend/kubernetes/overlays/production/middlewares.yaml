apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pgadmin-headers
spec:
  headers:
    customRequestHeaders:
      X-Script-Name: "/devops/api/pgadmin"
      X-Forwarded-Proto: "https"

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chatbot-cors
spec:
  headers:
    accessControlAllowMethods:
      - "GET"
      - "POST"
      - "OPTIONS"
    accessControlAllowHeaders:
      - "Authorization"
      - "Content-Type"
    accessControlAllowOriginList:
      - "https://shanify.shane-donnelly.fr"
    accessControlMaxAge: 100
    addVaryHeader: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chatbot-strip
spec:
  stripPrefix:
    prefixes:
      - /devops/api/chatbot

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: root-redirect
spec:
  redirectRegex:
    regex: "^https://shanify.shane-donnelly.fr/?$"
    replacement: "https://shanify.shane-donnelly.fr/devops/shanify/"
    permanent: true