name: CD Production - Sync tags from staging

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-tags-to-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy tags from staging to production
        run: |
          STAGING_FILE="backend/kubernetes/overlays/staging/kustomization.yaml"
          PROD_FILE="backend/kubernetes/overlays/production/kustomization.yaml"
          
          extract_tag() {
            local service=$1
            local file=$2
            awk -v svc="$service" '
              $0 ~ "name: " svc { found=1; next }
              found && /newTag:/ { gsub(/.*newTag: "|"/, ""); print; exit }
            ' "$file"
          }
          
          BUILDER_TAG=$(extract_tag "shanedonnelly34/builder-service" "$STAGING_FILE")
          CATALOGUE_TAG=$(extract_tag "shanedonnelly34/catalogue-service" "$STAGING_FILE")
          CHATBOT_TAG=$(extract_tag "shanedonnelly34/chatbot-microservice" "$STAGING_FILE")
          NGINX_TAG=$(extract_tag "shanedonnelly34/nginx" "$STAGING_FILE")
          
          echo "Tags found: builder=$BUILDER_TAG, catalogue=$CATALOGUE_TAG, chatbot=$CHATBOT_TAG, nginx=$NGINX_TAG"
          
          # Update production kustomization only if tags are found
          if [ -n "$BUILDER_TAG" ]; then
            sed -i "/name: shanedonnelly34\/builder-service/{n;s/newTag: .*/newTag: \"$BUILDER_TAG\"/}" "$PROD_FILE"
          fi
          
          if [ -n "$CATALOGUE_TAG" ]; then
            sed -i "/name: shanedonnelly34\/catalogue-service/{n;s/newTag: .*/newTag: \"$CATALOGUE_TAG\"/}" "$PROD_FILE"
          fi
          
          if [ -n "$CHATBOT_TAG" ]; then
            sed -i "/name: shanedonnelly34\/chatbot-microservice/{n;s/newTag: .*/newTag: \"$CHATBOT_TAG\"/}" "$PROD_FILE"
          fi
          
          if [ -n "$NGINX_TAG" ]; then
            sed -i "/name: shanedonnelly34\/nginx/{n;s/newTag: .*/newTag: \"$NGINX_TAG\"/}" "$PROD_FILE"
          fi
          
          echo "Production kustomization updated:"
          cat "$PROD_FILE"

      - name: Commit production update
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/kubernetes/overlays/production/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci(prod): sync image tags from staging [skip ci]"
          git push

  deploy-production:
    runs-on: ubuntu-latest
    needs: sync-tags-to-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # S'assurer d'avoir les derniers changements

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup kubectl
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: version --client

      - name: Deploy to production
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: apply -k backend/kubernetes/overlays/production

      - name: Wait for postgres
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: wait --for=condition=ready pod -l app=postgres -n sitebuilder-production --timeout=180s

      - name: Wait for minio
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: wait --for=condition=ready pod -l app=minio -n sitebuilder-production --timeout=180s

      - name: Show deployment status
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: get pods -n sitebuilder-production

      - name: Show ingress
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: get ingress -n sitebuilder-production