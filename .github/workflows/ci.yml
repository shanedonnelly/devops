name: CI Pipeline

on:
  pull_request:
    branches: [dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.filter.outputs.builder }}
      catalogue: ${{ steps.filter.outputs.catalogue }}
      chatbot: ${{ steps.filter.outputs.chatbot }}
      any_service: ${{ steps.filter.outputs.any_service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            builder:
              - 'backend/builder-service/**'
            catalogue:
              - 'backend/catalogue-service/**'
            chatbot:
              - 'backend/chatbot-microservice/**'
            any_service:
              - 'backend/builder-service/**'
              - 'backend/catalogue-service/**'
              - 'backend/chatbot-microservice/**'

  test-builder:
    needs: detect-changes
    if: needs.detect-changes.outputs.builder == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/service/builder-service-test.sh
        working-directory: backend

  test-catalogue:
    needs: detect-changes
    if: needs.detect-changes.outputs.catalogue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/service/catalogue-service-test.sh
        working-directory: backend

  test-chatbot:
    needs: detect-changes
    # chatbot depends on catalogue, so run its tests if either changed
    if: needs.detect-changes.outputs.chatbot == 'true' || needs.detect-changes.outputs.catalogue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/service/chatbot-microservice-test.sh
        working-directory: backend

  e2e-tests:
    needs: [detect-changes, test-builder, test-catalogue, test-chatbot]
    if: |
      always() && 
      needs.detect-changes.outputs.any_service == 'true' &&
      needs.test-builder.result != 'failure' &&
      needs.test-catalogue.result != 'failure' &&
      needs.test-chatbot.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for test in test/e2e/*.sh; do
            bash "$test"
          done
        working-directory: backend
  ci-status:
    needs: [detect-changes, test-builder, test-catalogue, test-chatbot, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.e2e-tests.result }}" == "failure" ] || \
             [ "${{ needs.test-builder.result }}" == "failure" ] || \
             [ "${{ needs.test-catalogue.result }}" == "failure" ] || \
             [ "${{ needs.test-chatbot.result }}" == "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"