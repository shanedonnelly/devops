name: CD Pipeline - Build & Push to DockerHub

on:
  push:
    branches: [dev]
    paths:
      - 'backend/builder-service/**'
      - 'backend/catalogue-service/**'
      - 'backend/chatbot-microservice/**'
      - 'backend/nginx/**'
      - 'front/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.filter.outputs.builder }}
      catalogue: ${{ steps.filter.outputs.catalogue }}
      chatbot: ${{ steps.filter.outputs.chatbot }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            builder:
              - 'backend/builder-service/**'
            catalogue:
              - 'backend/catalogue-service/**'
            chatbot:
              - 'backend/chatbot-microservice/**'
            nginx:
              - 'backend/nginx/**'
              - 'front/**'

  build-push-builder:
    needs: detect-changes
    if: needs.detect-changes.outputs.builder == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION
        run: |
          cd backend/builder-service
          CURRENT=$(cat VERSION)
          NEW=$(bash ../script/new_version.sh "$CURRENT")
          echo "$NEW" > VERSION
          echo "VERSION=$NEW" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/builder-service:${{ env.VERSION }} backend/builder-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/builder-service:${{ env.VERSION }}

      - name: Update staging kustomization
        run: |
          sed -i 's|name: shanedonnelly34/builder-service|name: shanedonnelly34/builder-service\n    newTag: "${{ env.VERSION }}"|' backend/kubernetes/overlays/staging/kustomization.yaml || \
          sed -i 's|newTag: ".*" # builder|newTag: "${{ env.VERSION }}" # builder|' backend/kubernetes/overlays/staging/kustomization.yaml

      - name: Update staging kustomization (proper)
        run: |
          cd backend/kubernetes/overlays/staging
          sed -i '/name: shanedonnelly34\/builder-service/{n;s/newTag: .*/newTag: "${{ env.VERSION }}"/}' kustomization.yaml

      - name: Commit changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/builder-service/VERSION backend/kubernetes/overlays/staging/kustomization.yaml
          git commit -m "ci: bump builder-service to ${{ env.VERSION }}"
          git push

  build-push-catalogue:
    needs: detect-changes
    if: needs.detect-changes.outputs.catalogue == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION
        run: |
          cd backend/catalogue-service
          CURRENT=$(cat VERSION)
          NEW=$(bash ../script/new_version.sh "$CURRENT")
          echo "$NEW" > VERSION
          echo "VERSION=$NEW" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/catalogue-service:${{ env.VERSION }} backend/catalogue-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/catalogue-service:${{ env.VERSION }}

      - name: Update staging kustomization
        run: |
          cd backend/kubernetes/overlays/staging
          sed -i '/name: shanedonnelly34\/catalogue-service/{n;s/newTag: .*/newTag: "${{ env.VERSION }}"/}' kustomization.yaml

      - name: Commit changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/catalogue-service/VERSION backend/kubernetes/overlays/staging/kustomization.yaml
          git commit -m "ci: bump catalogue-service to ${{ env.VERSION }}"
          git push

  build-push-chatbot:
    needs: detect-changes
    if: needs.detect-changes.outputs.chatbot == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION
        run: |
          cd backend/chatbot-microservice
          CURRENT=$(cat VERSION)
          NEW=$(bash ../script/new_version.sh "$CURRENT")
          echo "$NEW" > VERSION
          echo "VERSION=$NEW" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-microservice:${{ env.VERSION }} backend/chatbot-microservice
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-microservice:${{ env.VERSION }}

      - name: Update staging kustomization
        run: |
          cd backend/kubernetes/overlays/staging
          sed -i '/name: shanedonnelly34\/chatbot-microservice/{n;s/newTag: .*/newTag: "${{ env.VERSION }}"/}' kustomization.yaml

      - name: Commit changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/chatbot-microservice/VERSION backend/kubernetes/overlays/staging/kustomization.yaml
          git commit -m "ci: bump chatbot-microservice to ${{ env.VERSION }}"
          git push

  build-push-nginx:
    needs: detect-changes
    if: needs.detect-changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION
        run: |
          cd backend/nginx
          CURRENT=$(cat VERSION)
          NEW=$(bash ../script/new_version.sh "$CURRENT")
          echo "$NEW" > VERSION
          echo "VERSION=$NEW" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend
        run: |
          cd front
          npm ci
          npm run build

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ env.VERSION }} backend/nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ env.VERSION }}

      - name: Update staging kustomization
        run: |
          cd backend/kubernetes/overlays/staging
          sed -i '/name: shanedonnelly34\/nginx/{n;s/newTag: .*/newTag: "${{ env.VERSION }}"/}' kustomization.yaml

      - name: Commit changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/nginx/VERSION backend/kubernetes/overlays/staging/kustomization.yaml
          git commit -m "ci: bump nginx to ${{ env.VERSION }}"
          git push